[package]
name = "chocosigner"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.14"
xous = "0.9.70"
xous-ipc = "0.10.10"
log-server = { package = "xous-api-log", version = "0.1.69" }
xous-names = { package = "xous-api-names", version = "0.9.71" }
utralib = { version = "0.1.27", optional = true, default-features = false }
bao1x-hal-service = { path = "../../services/bao1x-hal-service" }
ed25519-dalek = { package = "ed25519-dalek-compat", path = "../../bao1x-boot/ed25519-dalek-compat", default-features = false, features = [
    "digest",
    "zeroize",
] }

[features]
bao1x = ["utralib/bao1x"]
board-dabao = ["bao1x-hal-service/board-dabao"]
default = []
